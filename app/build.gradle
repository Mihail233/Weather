plugins {
    id("java")
    id("war")
}

group = "ru.dadyDobro"
version = "1.0-SNAPSHOT"

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // This dependency is used by the application.
    implementation 'org.springframework:spring-orm:7.0.8'
    implementation 'org.springframework:spring-webmvc:7.0.8'

    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    implementation 'tools.jackson.core:jackson-databind:3.2.0'

    runtimeOnly 'org.postgresql:postgresql:42.7.11'
    implementation 'org.hibernate.orm:hibernate-core:6.4.10.Final'
    implementation 'com.zaxxer:HikariCP:7.0.2'

    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.2.Final'

    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

task prepareKotlinBuildScriptModel {
}

apply plugin: 'idea'
