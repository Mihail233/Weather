db.driver=org.postgresql.ds.PGSimpleDataSource
db.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD}

hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=create-drop
hibernate.default_schema=public
openWeather.api.key=${OPENWEATHER_API_KEY:test}
openWeather.api.base-url=https://api.openweathermap.org
