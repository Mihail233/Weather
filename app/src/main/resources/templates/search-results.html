<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img th:src="@{/static/img/weather-app.png}" alt="" width="30" height="24"
                 class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3" th:text="${user_name}"></span>
            <form th:action="@{/sign-out}" method="post">
                <button class="btn btn-outline-danger">Sign out</button>
            </form>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <form th:action="@{/location/search}" method="post">

            <div class="d-flex my-4">
                <div class="input-group location-search-input-group me-3">
                    <input class="form-control" type="text" name="locationName" placeholder="Enter location"
                           th:value="${previousSearch}"
                           required>
                </div>
                <button class="btn btn-outline-secondary btn-sm clear-input-button me-3" formmethod="get">
                    &times;
                </button>
                <button class="btn btn-outline-success">Search</button>
            </div>

        </form>

        <div>
            <h2>Locations:</h2>
            <div class="row">
                <div class="col-12 col-lg-3 col-md-6 mb-4" th:each="locationResponse : ${locationResponses}">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">
                            <form th:action="@{/location/add(name=${locationResponse.name()}, country=${locationResponse.country()}, latitude=${locationResponse.latitude()}, longitude=${locationResponse.longitude()})}"
                                  method="post">
                                <h5 class="card-title" th:text="${locationResponse.name}"></h5>
                                <p class="card-text mb-1" th:text="${'Latitude: ' + locationResponse.latitude()}"></p>
                                <p class="card-text mb-1" th:text="${'Longitude: ' + locationResponse.longitude()}"></p>
                                <p class="card-text mb-1" th:text="${'Country: ' + locationResponse.country()}"></p>
                                <p class="card-text mb-3" th:text="${'State: ' + locationResponse.state()}"></p>
                                <div class="mt-auto">
                                    <button class="btn btn-primary w-100">Add</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
