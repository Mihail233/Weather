<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-6">
            <div class="weather-logo"></div>
        </div>
    </div>

    <h2 class="text-center mb-5">Sign Up</h2>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-4 col-md-6 col-sm-12"
             th:object="${signUpDTO}" th:with="hasErrors=${#fields.hasErrors('global')}">
            <div role="alert" th:class="${hasErrors} ? 'alert alert-danger'"
                 th:text="${hasErrors} ? ${T(org.weather.util.FormUtil).toString(#fields.detailedErrors('global'))}">
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-4 col-md-6 col-sm-12">

            <form method="post" class="mt-4" th:action="@{/sign-up}" th:object="${signUpDTO}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group has-validation" th:with="hasErrors=${#fields.hasErrors('username')}">
                        <input type="text" class="form-control" id="username"
                               th:field="*{username}" th:classappend="${hasErrors} ? 'is-invalid'"
                               value="" required/>
                        <div class="invalid-feedback"
                             th:text="${hasErrors} ? ${T(org.weather.util.FormUtil).toString(#fields.detailedErrors('username'))}">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group has-validation" th:with="hasErrors=${#fields.hasErrors('password')}">
                        <input type="password" class="form-control" id="password"
                               th:field="*{password}" th:classappend="${hasErrors} ? 'is-invalid'"
                               value="" required/>
                        <div class="invalid-feedback"
                             th:text="${hasErrors} ? ${T(org.weather.util.FormUtil).toString(#fields.detailedErrors('password'))}">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="repeat-password" class="form-label">Repeat password</label>
                    <input type="password" class="form-control" id="repeat-password" th:field="*{repeatedPassword}"
                           value="" required/>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Sign Up</button>
                <p class="mt-2 text-center">Already have an account? <a th:href="@{/sign-in}">Sign in here</a></p>
            </form>
        </div>
    </div>
</div>

</body>
</html>
